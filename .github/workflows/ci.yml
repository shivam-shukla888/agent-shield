# ============================================================
# AgentGuard — CI Pipeline
# ============================================================
# Runs on push and pull_request.
# Validates: lint, tests, security tests, Docker build.
# No real external dependencies (PostgreSQL, LLM APIs, targets).
# ============================================================

name: AgentGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Full Test Suite
        run: pytest -v --tb=short

      - name: Run Security Tests
        run: pytest -v --tb=short tests/test_security_hardening.py tests/test_security_verification.py tests/test_ssrf.py tests/test_auth.py tests/test_rate_limit.py

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile Exists
        run: test -f Dockerfile

      - name: Validate No Secrets in Dockerfile
        run: |
          # Ensure no hardcoded secrets in Dockerfile
          ! grep -iE '(password|secret|api_key|token)\s*=' Dockerfile || echo "WARNING: potential secret pattern found"

      - name: Build Docker Image
        run: docker build -t agentguard:ci-${{ github.sha }} .

      - name: Verify Image Runs
        run: |
          docker run --rm -d --name agentguard-ci -p 8000:8000 agentguard:ci-${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs agentguard-ci && exit 1)
          docker stop agentguard-ci

  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        run: |
          echo "=== Scanning for potential secret leaks ==="
          FOUND=0

          # Check for common secret patterns in Python source
          if grep -rn --include="*.py" -iE '(sk-[a-zA-Z0-9]{20,}|gsk_[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16})' app/ tests/; then
            echo "ERROR: Potential API key found in source"
            FOUND=1
          fi

          # Check for hardcoded DATABASE_URL with real credentials
          if grep -rn --include="*.py" -E 'postgresql://[a-zA-Z0-9]+:[a-zA-Z0-9]+@[a-zA-Z0-9]' app/; then
            echo "ERROR: Potential real DATABASE_URL in source"
            FOUND=1
          fi

          # Verify .env is not committed
          if [ -f .env ]; then
            echo "ERROR: .env file is tracked in git"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi

          echo "=== No secret leaks detected ==="
